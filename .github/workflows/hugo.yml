name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  # mainブランチにプッシュされた時に作動
  workflow_dispatch: # 手動実行も許可

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # テーマ（サブモジュール）も一緒に取得する重要設定！
          fetch-depth: 0         # 更新日時を正しく取得するために履歴を全て取得

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest' # 常に最新のHugoを使用
          extended: true

      - name: Build with Hugo
        run: hugo --minify       # HTML等を圧縮してビルド

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public         # Hugoが生成したフォルダを指定

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
